<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1100" width="1120" height="1100"
     color="#2A2822" font-family="ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace">
  <title>02 - Once per batch</title>
  <rect x="0" y="0" width="1120" height="1100" fill="#FFFFFF"/>

      <defs>
        <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
                markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
        </marker>
      </defs>

      <!-- START -->
      <g font-family="ui-monospace,monospace" font-size="12.5" fill="#1C1B17">
        <rect x="380" y="20" width="280" height="48" rx="24" fill="#FFFFFF"
              stroke="currentColor" stroke-width="1"/>
        <text x="520" y="49" text-anchor="middle">Ingestion batch finished</text>
      </g>
      <line x1="520" y1="68" x2="520" y2="108" stroke="currentColor" marker-end="url(#a2)"/>

      <!-- LEARN BOILERPLATE section -->
      <g font-family="ui-monospace,monospace" font-size="12" fill="#1C1B17">
        <rect x="340" y="110" width="360" height="60" rx="6"
              fill="rgba(201,150,74,.10)" stroke="#C9964A" stroke-width="1.5"/>
        <text x="520" y="135" text-anchor="middle" font-size="12.5">For each sender with ≥ 4 messages,</text>
        <text x="520" y="153" text-anchor="middle" font-size="12.5">any line in ≥ 50% of them?</text>
      </g>
      <!-- YES -->
      <path d="M520,170 L520,210" fill="none" stroke="currentColor" marker-end="url(#a2)"/>
      <text x="530" y="200" font-family="ui-monospace,monospace" font-size="11"
            fill="#4FA97B" letter-spacing=".08em">YES</text>
      <g font-family="ui-monospace,monospace" font-size="12" fill="#1C1B17">
        <rect x="340" y="210" width="360" height="44" rx="4"
              fill="rgba(149,110,190,.10)" stroke="#956EBE" stroke-width="1.5"/>
        <text x="520" y="230" text-anchor="middle">INSERT sender_boilerplate</text>
        <text x="520" y="246" text-anchor="middle" font-size="10" fill="currentColor"
              opacity=".7">learned per sender — signature, disclaimer, "sent from…"</text>
      </g>
      <line x1="520" y1="254" x2="520" y2="290" stroke="currentColor" marker-end="url(#a2)"/>

      <!-- PROMOTE candidates block -->
      <rect x="180" y="290" width="780" height="500" fill="none"
            stroke="currentColor" stroke-dasharray="3 4" opacity=".35"/>
      <text x="196" y="311" font-family="ui-monospace,monospace" font-size="10.5"
            fill="currentColor" opacity=".65" letter-spacing=".12em">
        FOR EACH CANDIDATE IDENTIFIER
      </text>

      <!-- n1 decision: seen ≥3 times? -->
      <g font-family="ui-monospace,monospace" font-size="12.5" fill="#1C1B17">
        <rect x="380" y="330" width="280" height="60" rx="6"
              fill="rgba(201,150,74,.10)" stroke="#C9964A" stroke-width="1.5"/>
        <text x="520" y="355" text-anchor="middle">Seen ≥ 3 different times</text>
        <text x="520" y="373" text-anchor="middle">across the corpus?</text>
      </g>

      <!-- NO → left → drop -->
      <path d="M380,360 L240,360 L240,410" fill="none" stroke="currentColor"
            opacity=".75" marker-end="url(#a2)"/>
      <text x="252" y="352" font-family="ui-monospace,monospace" font-size="11"
            fill="#E24F3B" letter-spacing=".08em">NO</text>
      <circle cx="240" cy="446" r="34" fill="rgba(226,79,59,.15)"
              stroke="#E24F3B" stroke-width="2"/>
      <text x="240" y="443" text-anchor="middle" font-family="ui-monospace,monospace"
            font-size="10" fill="#E24F3B" letter-spacing=".14em" font-weight="600">DROPPED</text>
      <text x="240" y="458" text-anchor="middle" font-family="ui-monospace,monospace"
            font-size="8.5" fill="#E24F3B" opacity=".8">too rare</text>

      <!-- YES → down -->
      <path d="M520,390 L520,430" fill="none" stroke="currentColor" marker-end="url(#a2)"/>
      <text x="530" y="420" font-family="ui-monospace,monospace" font-size="11"
            fill="#4FA97B" letter-spacing=".08em">YES</text>

      <!-- n2 decision: first seen in subject/filename? -->
      <g font-family="ui-monospace,monospace" font-size="12.5" fill="#1C1B17">
        <rect x="360" y="430" width="320" height="60" rx="6"
              fill="rgba(201,150,74,.10)" stroke="#C9964A" stroke-width="1.5"/>
        <text x="520" y="455" text-anchor="middle">First observed in a subject</text>
        <text x="520" y="473" text-anchor="middle">or a filename?</text>
      </g>

      <!-- NO → right → match existing only -->
      <path d="M680,460 L810,460 L810,530" fill="none" stroke="currentColor"
            opacity=".75" marker-end="url(#a2)"/>
      <text x="706" y="452" font-family="ui-monospace,monospace" font-size="11"
            fill="#E24F3B" letter-spacing=".08em">NO</text>
      <g font-family="ui-monospace,monospace" font-size="12" fill="#1C1B17">
        <rect x="680" y="530" width="260" height="44" rx="4"
              fill="rgba(149,110,190,.10)" stroke="#956EBE" stroke-width="1.5"/>
        <text x="810" y="551" text-anchor="middle">Match an existing project</text>
        <text x="810" y="567" text-anchor="middle" font-size="10" fill="currentColor"
              opacity=".7">bodies can match, never create</text>
      </g>

      <!-- YES → down → create project -->
      <path d="M520,490 L520,530" fill="none" stroke="currentColor" marker-end="url(#a2)"/>
      <text x="530" y="520" font-family="ui-monospace,monospace" font-size="11"
            fill="#4FA97B" letter-spacing=".08em">YES</text>
      <g font-family="ui-monospace,monospace" font-size="12" fill="#1C1B17">
        <rect x="380" y="530" width="280" height="44" rx="4"
              fill="rgba(149,110,190,.10)" stroke="#956EBE" stroke-width="1.5"/>
        <text x="520" y="551" text-anchor="middle">INSERT project + alias</text>
        <text x="520" y="567" text-anchor="middle" font-size="10" fill="currentColor"
              opacity=".7">confirmed = 0 until a human agrees</text>
      </g>

      <!-- both lanes merge to n3 assign -->
      <path d="M810,574 L810,620 L680,620" fill="none" stroke="currentColor"
            opacity=".75" marker-end="url(#a2)"/>
      <line x1="520" y1="574" x2="520" y2="620" stroke="currentColor"/>
      <line x1="520" y1="620" x2="520" y2="660" stroke="currentColor" marker-end="url(#a2)"/>

      <g font-family="ui-monospace,monospace" font-size="12" fill="#1C1B17">
        <rect x="340" y="660" width="360" height="44" rx="4"
              fill="rgba(149,110,190,.10)" stroke="#956EBE" stroke-width="1.5"/>
        <text x="520" y="681" text-anchor="middle">INSERT message_project · attachment_project</text>
        <text x="520" y="697" text-anchor="middle" font-size="10" fill="currentColor"
              opacity=".7">many-to-many at both levels</text>
      </g>

      <!-- Merge addresses -->
      <line x1="520" y1="704" x2="520" y2="740" stroke="currentColor" marker-end="url(#a2)"/>
      <g font-family="ui-monospace,monospace" font-size="12" fill="#1C1B17">
        <rect x="360" y="740" width="320" height="44" rx="4"
              fill="#F5F3EF" stroke="currentColor" stroke-width="1"/>
        <text x="520" y="761" text-anchor="middle">Merge address candidates into projects</text>
        <text x="520" y="776" text-anchor="middle" font-size="10" fill="currentColor"
              opacity=".7">if the address is also an alias of a known job</text>
      </g>

      <!-- outside loop bracket -->
      <line x1="520" y1="790" x2="520" y2="830" stroke="currentColor" marker-end="url(#a2)"/>

      <!-- Propagate via threads -->
      <g font-family="ui-monospace,monospace" font-size="12" fill="#1C1B17">
        <rect x="340" y="830" width="360" height="60" rx="6"
              fill="rgba(201,150,74,.10)" stroke="#C9964A" stroke-width="1.5"/>
        <text x="520" y="855" text-anchor="middle">Any tagged message has an untagged reply</text>
        <text x="520" y="873" text-anchor="middle">or an untagged parent in the same thread?</text>
      </g>
      <path d="M520,890 L520,930" fill="none" stroke="currentColor" marker-end="url(#a2)"/>
      <text x="530" y="920" font-family="ui-monospace,monospace" font-size="11"
            fill="#4FA97B" letter-spacing=".08em">YES</text>
      <g font-family="ui-monospace,monospace" font-size="12" fill="#1C1B17">
        <rect x="340" y="930" width="360" height="44" rx="4"
              fill="rgba(149,110,190,.10)" stroke="#956EBE" stroke-width="1.5"/>
        <text x="520" y="951" text-anchor="middle">Tag the sibling with the same project</text>
        <text x="520" y="967" text-anchor="middle" font-size="10" fill="currentColor"
              opacity=".7">method = "thread"</text>
      </g>

      <!-- END READY -->
      <line x1="520" y1="974" x2="520" y2="1010" stroke="currentColor" marker-end="url(#a2)"/>
      <circle cx="520" cy="1046" r="36" fill="rgba(79,169,123,.15)"
              stroke="#4FA97B" stroke-width="2"/>
      <text x="520" y="1043" text-anchor="middle" font-family="ui-monospace,monospace"
            font-size="11" fill="#4FA97B" letter-spacing=".14em" font-weight="600">READY</text>
      <text x="520" y="1058" text-anchor="middle" font-family="ui-monospace,monospace"
            font-size="8.5" fill="#4FA97B" opacity=".8">questions can now be answered</text>
    
</svg>
